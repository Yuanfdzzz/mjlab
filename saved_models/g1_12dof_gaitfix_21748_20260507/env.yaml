      pos: !!python/tuple
      - 0.0
      - 0.0
      - 0.0
      rot: !!python/tuple
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      lin_vel: !!python/tuple
      - 0.0
      - 0.0
      - 0.0
      ang_vel: !!python/tuple
      - 0.0
      - 0.0
      - 0.0
      joint_pos:
        .*: 0.0
      joint_vel:
        .*: 0.0
    spec_fn: !!python/name:mjlab.entity.entity.%3Clambda%3E ''
    articulation: null
    sort_actuators: false
    lights: !!python/tuple
    - name: sun
      body: world
      mode: fixed
      target: null
      type: directional
      castshadow: true
      pos: !!python/tuple
      - 0.0
      - 0.0
      - 1.5
      dir: !!python/tuple
      - 0.0
      - 0.0
      - -1.0
      cutoff: 45.0
      exponent: 10.0
    cameras: !!python/tuple []
    textures: !!python/tuple
    - name: groundplane
      type: 2d
      builtin: checker
      rgb1: !!python/tuple
      - 0.2
      - 0.3
      - 0.4
      rgb2: !!python/tuple
      - 0.1
      - 0.2
      - 0.3
      width: 300
      height: 300
      mark: edge
      markrgb: !!python/tuple
      - 0.8
      - 0.8
      - 0.8
    materials: !!python/tuple
    - name: groundplane
      rgba: !!python/tuple
      - 1.0
      - 1.0
      - 1.0
      - 1.0
      texuniform: true
      texrepeat: !!python/tuple
      - 4.0
      - 4.0
      reflectance: 0.2
      texture: groundplane
      geom_names_expr: !!python/tuple
      - terrain$
    collisions: !!python/tuple []
    terrain_type: generator
    terrain_generator:
      seed: null
      curriculum: true
      size: !!python/tuple
      - 8.0
      - 8.0
      border_width: 20.0
      border_height: 1.0
      num_rows: 6
      num_cols: 3
      color_scheme: height
      sub_terrains:
        flat:
          proportion: 0.5
          size: !!python/tuple
          - 8.0
          - 8.0
          flat_patch_sampling: null
        gentle_up_slope:
          proportion: 0.35
          size: !!python/tuple
          - 8.0
          - 8.0
          flat_patch_sampling: null
          slope_range: !!python/tuple
          - 0.0
          - 0.25
          platform_width: 2.0
          inverted: false
          border_width: 0.25
          horizontal_scale: 0.1
          vertical_scale: 0.005
          base_thickness_ratio: 1.0
        low_open_stairs:
          proportion: 0.15
          size: !!python/tuple
          - 8.0
          - 8.0
          flat_patch_sampling: null
          step_height_range: !!python/tuple
          - 0.015
          - 0.055
          step_width_range: !!python/tuple
          - 0.75
          - 1.05
          platform_width: 1.0
          border_width: 0.25
          step_thickness: 0.05
          inverted: false
      difficulty_range: !!python/tuple
      - 0.0
      - 1.0
      add_lights: true
    env_spacing: 2.0
    max_init_terrain_level: 0
    num_envs: 512
  entities:
    robot:
      init_state:
        pos: !!python/tuple
        - 0.0
        - 0.0
        - 0.8
        rot: !!python/tuple
        - 1.0
        - 0.0
        - 0.0
        - 0.0
        lin_vel: !!python/tuple
        - 0.0
        - 0.0
        - 0.0
        ang_vel: !!python/tuple
        - 0.0
        - 0.0
        - 0.0
        joint_pos:
          left_hip_pitch_joint: -0.1
          left_hip_roll_joint: 0.0
          left_hip_yaw_joint: 0.0
          left_knee_joint: 0.3
          left_ankle_pitch_joint: -0.2
          left_ankle_roll_joint: 0.0
          right_hip_pitch_joint: -0.1
          right_hip_roll_joint: 0.0
          right_hip_yaw_joint: 0.0
          right_knee_joint: 0.3
          right_ankle_pitch_joint: -0.2
          right_ankle_roll_joint: 0.0
