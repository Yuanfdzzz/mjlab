        actuators: !!python/tuple
        - target_names_expr: !!python/tuple
          - .*_hip_yaw_joint
          - .*_hip_pitch_joint
          transmission_type: !!python/object/apply:mjlab.actuator.actuator.TransmissionType
          - joint
          armature: 0.01
          frictionloss: 0.1
          viscous_damping: null
          delay_min_lag: 0
          delay_max_lag: 0
          delay_hold_prob: 0.0
          delay_update_period: 0
          delay_per_env_phase: true
          stiffness: 100.0
          damping: 2.0
          effort_limit: 88.0
        - target_names_expr: !!python/tuple
          - .*_hip_roll_joint
          transmission_type: !!python/object/apply:mjlab.actuator.actuator.TransmissionType
          - joint
          armature: 0.01
          frictionloss: 0.1
          viscous_damping: null
          delay_min_lag: 0
          delay_max_lag: 0
          delay_hold_prob: 0.0
          delay_update_period: 0
          delay_per_env_phase: true
          stiffness: 100.0
          damping: 2.0
          effort_limit: 139.0
        - target_names_expr: !!python/tuple
          - .*_knee_joint
          transmission_type: !!python/object/apply:mjlab.actuator.actuator.TransmissionType
          - joint
          armature: 0.01
          frictionloss: 0.1
          viscous_damping: null
          delay_min_lag: 0
          delay_max_lag: 0
          delay_hold_prob: 0.0
          delay_update_period: 0
          delay_per_env_phase: true
          stiffness: 150.0
          damping: 4.0
          effort_limit: 139.0
        - target_names_expr: !!python/tuple
          - .*_ankle_pitch_joint
          - .*_ankle_roll_joint
          transmission_type: !!python/object/apply:mjlab.actuator.actuator.TransmissionType
          - joint
          armature: 0.01
          frictionloss: 0.1
          viscous_damping: null
          delay_min_lag: 0
          delay_max_lag: 0
          delay_hold_prob: 0.0
          delay_update_period: 0
          delay_per_env_phase: true
          stiffness: 40.0
          damping: 2.0
          effort_limit: 50.0
        soft_joint_pos_limit_factor: 0.9
      sort_actuators: true
      lights: !!python/tuple []
      cameras: !!python/tuple []
      textures: !!python/tuple []
      materials: !!python/tuple []
      collisions: !!python/tuple []
  sensors: !!python/tuple
  - name: terrain_scan
    frame:
      type: body
      name: pelvis
      entity: robot
    pattern:
      size: !!python/tuple
      - 2.2
      - 1.4
      resolution: 0.1
      direction: !!python/tuple
      - 0.0
      - 0.0
      - -1.0
    ray_alignment: yaw
    max_distance: 6.0
    exclude_parent_body: true
    include_geom_groups: !!python/tuple
    - 0
    debug_vis: true
    viz:
      hit_color: !!python/tuple
      - 0.0
      - 1.0
      - 0.0
      - 0.8
      miss_color: !!python/tuple
      - 1.0
      - 0.0
      - 0.0
      - 0.4
      hit_sphere_color: !!python/tuple
      - 0.0
      - 1.0
      - 1.0
      - 1.0
      hit_sphere_radius: 0.5
      show_rays: false
      show_normals: false
      normal_color: !!python/tuple
      - 1.0
      - 1.0
      - 0.0
      - 1.0
      normal_length: 5.0
  - name: foot_height_scan
    frame: !!python/tuple
    - type: site
      name: left_foot
      entity: robot
    - type: site
      name: right_foot
      entity: robot
    pattern:
      rings: !!python/tuple
      - radius: 0.03
        num_samples: 6
      include_center: true
      direction: !!python/tuple
      - 0.0
      - 0.0
      - -1.0
    ray_alignment: yaw
    max_distance: 1.0
    exclude_parent_body: true
    include_geom_groups: !!python/tuple
    - 0
    debug_vis: true
    viz:
      hit_color: !!python/tuple
      - 1.0
      - 0.0
      - 1.0
      - 0.8
      miss_color: !!python/tuple
      - 1.0
      - 0.0
      - 0.0
      - 0.4
      hit_sphere_color: !!python/tuple
      - 1.0
      - 0.0
      - 1.0
      - 1.0
      hit_sphere_radius: 0.5
      show_rays: true
      show_normals: false
      normal_color: !!python/tuple
      - 1.0
      - 1.0
      - 0.0
      - 1.0
      normal_length: 5.0
    reduction: min
  - name: feet_ground_contact
    primary:
      mode: subtree
      pattern: ^(left_ankle_roll_link|right_ankle_roll_link)$
      entity: robot
      exclude: !!python/tuple []
    secondary:
      mode: body
      pattern: terrain
      entity: null
      exclude: !!python/tuple []
    fields: !!python/tuple
    - found
    - force
    reduce: netforce
    num_slots: 1
    secondary_policy: first
    track_air_time: true
    global_frame: false
    history_length: 0
    debug: false
  - name: self_collision
    primary:
      mode: subtree
      pattern: pelvis
      entity: robot
      exclude: !!python/tuple []
    secondary:
      mode: subtree
      pattern: pelvis
      entity: robot
      exclude: !!python/tuple []
    fields: !!python/tuple
    - found
    - force
    reduce: none
    num_slots: 1
    secondary_policy: first
    track_air_time: false
    global_frame: false
    history_length: 4
    debug: false
